[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rerate"
version = "0.1.0"
description = "Freight invoice audit in DuckDB SQL: re-rates every bill against the contract and diesel week in force on the ship date, and benchmarks lanes on distance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rerate contributors" }]
keywords = ["freight-audit", "duckdb", "sql-analysis", "logistics"]
dependencies = [
  "duckdb>=1.1",
  "numpy>=1.26",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyyaml>=6",
]

[project.scripts]
rerate = "rerate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rerate"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "rerate/_sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
